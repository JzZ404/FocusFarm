<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Map Preview — FocusFarm</title>
<style>
  html, body { margin: 0; background: #111; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: 1100px; image-rendering: pixelated; display: block; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <!-- Same two scripts FarmCanvas.tsx loads, same render call, same seed.
       Isolated from the app shell (no header/buttons/animals) so map edits
       can be screenshotted and reviewed on their own before touching the
       real /farm page. Dev tool only — not linked from anywhere in the app. -->
  <script src="/focusfarm/sprites.js"></script>
  <script src="/focusfarm/scene.js"></script>
  <script>
    window.FFScene.render(document.getElementById('c'), { seed: 7 });
  </script>
</body>
</html>
